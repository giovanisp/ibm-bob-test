name: L2 · PR Tests

on:
  # pull_request:                              # TEMPORARILY DISABLED
  #   branches: [main]
  #   types: [opened, synchronize, reopened]
  workflow_dispatch: # manual trigger only

jobs:
  test:
    name: Tool tests + Agent tests
    runs-on: ubuntu-latest

    env:
      WXO_API_KEY: ${{ secrets.WXO_API_KEY }}
      WXO_ENV_URL: ${{ secrets.WXO_ENV_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ADK and dependencies
        run: pip install ibm-watsonx-orchestrate pyyaml

      # Fresh GHA runners have no orchestrate config — register the env first
      - name: Register wxO environment
        run: orchestrate env add -n GSIBM -u "$WXO_ENV_URL" --type ibm_iam

      - name: Activate wxO environment (fetch token)
        run: orchestrate env activate GSIBM -a "$WXO_API_KEY"

      - name: Run tool unit tests (no wxO connection required)
        run: python tests/run_tests.py tool

      - name: Run agent integration tests (live wxO)
        run: python tests/run_tests.py agent
