[project]
name = "my-lab-project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ibm-watsonx-orchestrate",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.bandit]
targets = ["tools", "tests"]
skips = []
