[project]
name = "my-lab-project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ibm-watsonx-orchestrate",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["tools", "tests"]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["ibm_watsonx_orchestrate"]

[tool.bandit]
targets = ["tools", "tests"]
skips = []
